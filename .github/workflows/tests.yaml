# Fork-only pytest on every push. Lives on the `integration` run-from line so it
# runs on our pushes; it is NOT extracted onto the surgical off-`main` upstream PR
# branches (those stay minimal and rely on scripts/preflight.py locally + ljmerza's
# own validate.yaml on the PR). Complements the inherited validate.yaml (Hassfest/
# HACS), which only triggers on main/pull_request/schedule.
name: tests

on:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      - name: Run pytest
        run: python -m pytest -q
