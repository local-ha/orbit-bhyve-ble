// Reconstructed Protocol Buffer interface description for the
// Orbit B-Hyve XD Bluetooth hose-timer BLE data channel.
//
// This file is a RECONSTRUCTED interface description, built from observed
// wire-level traffic and behavioral testing against a device the project
// authors lawfully own. It is not a copy of any vendor source and is not a
// complete schema. Field numbers, wire types, and named messages have been
// validated by encoding messages from this schema and observing the device
// respond as expected.
//
// Field names where the vendor's exact name was not observable from public
// APIs are descriptive-English approximations chosen for clarity.
//
// See ../docs/encryption.md for the cipher and frame format that this
// schema rides inside, and ../README.md for the project context.

syntax = "proto2";

package orbit;

// Top-level IPC message sent over BLE
message IpcMsg {
  optional BleInitMsg       bleInitMsg      = 1;
  optional bool             enterBootloader = 2;
  optional BleBridgedDevices bleBridgedDevices = 3;
  // ... other fields ...
  repeated BleBridgedMsg    bleBridgedMsgs  = 87;
}

// Authentication / initialization message
// Must be sent first before any commands are accepted
message BleInitMsg {
  optional bytes  bdAddress  = 1;  // Device MAC address (6 bytes)
  optional bytes  networkKey = 2;  // Authentication key — UNKNOWN SOURCE
  optional uint32 advertType = 3;
  optional uint32 deviceSn   = 4;
}

// BLE bridge message wrapper
message BleBridgedMsg {
  optional BlePhyInterface phyInterface = 1;
  optional BleDeviceId     deviceId     = 2;
  optional uint32          deviceSn     = 3;

  oneof devSpecific {
    BleDevSpec_IrrigationTimer irrigationTimer = 10;
    BleDevSpec_FloodSensor     floodSensor     = 11;
    BleDevSpec_RawData         rawData         = 12;
  }
}

// Irrigation timer device specifics — valve control lives here
message BleDevSpec_IrrigationTimer {
  optional uint32           currentTimeSecEpochLocal = 1;
  optional WateringStatus   wateringStatus           = 2;
  optional SetRainDelay     rainDelay                = 3;
  optional DeviceStatus     deviceStatus             = 4;
  optional uint32           nextStartProgramFlags    = 5;
  optional uint32           nextStartTimeSecEpochUTC = 6;
}

// BLE bridge commands
message BleBridgedCmd {
  optional BlePhyInterface phyInterface = 1;
  optional BleDeviceId     deviceId     = 2;
  optional uint32          deviceSn     = 3;

  oneof message {
    bool             bleBridgedCmdDisconnect    = 10;
    UpdateFw         bleBridgedCmdUpdateFw      = 11;
    bool             bleBridgedCmdIdentify      = 12;
    OtaUpdateStart   bleBridgedCmdOtaUpdateStart = 13;
    bool             bleBridgedCmdAckAlarm      = 20;
  }
}

// Placeholder messages (details not yet recovered)
message BlePhyInterface {}
message BleDeviceId {}
message BleBridgedDevices {}
message UpdateFw {}
message OtaUpdateStart {}
message BleDevSpec_FloodSensor {}
message BleDevSpec_RawData {}

// ───────────────────────────────────────────────────────────────────────────
// Device data-channel messages (6c72 TX / 6c73 RX), reconstructed from the
// 2026-06-28 XD full-surface capture (HT34A-0001 fw0107). See
// ../docs/ble_protocol.md "Capability Command Catalog" for evidence. These are
// the messages actually observed on the wire; field names are descriptive.
// ───────────────────────────────────────────────────────────────────────────

// The single wrapper every data-channel frame carries. Exactly one payload
// field is set per message; its field number selects the type.
message OrbitBleMessage {
  optional bytes  bdAddress    = 1;   // device MAC (6 bytes), present on RX
  optional uint32 deviceClock  = 7;   // Unix epoch seconds (RX)

  optional SyncRequest     syncRequest    = 10;  // TX: empty -> full state dump (all #19 slots + #16 + #20)
  optional CloseConnection closeConnection = 11; // TX graceful pre-disconnect (empty body valid)
  optional TimerMode       timerMode      = 14;  // TX start/stop/controller-mode; RX active-run echo
  optional StatusRequest   statusRequest  = 15;  // TX: empty -> elicits a status burst
  optional DeviceStatus    deviceStatus   = 16;  // RX device state block
  optional SetRainDelay    rainDelay      = 17;  // TX set/clear rain delay
  optional SetClock        setClock       = 18;  // TX ISO-8601 clock (NO-OP over BLE; use #75)
  optional SetEpochTime    setEpochTime   = 75;  // TX real clock-set (UTC epoch + tz); elicits status
  optional WateringProgram program        = 19;  // TX/RX program create/edit/replace/delete/read
  optional SetActivePrograms setActivePrograms = 20; // TX/RX program-enable bitmask (A=bit0)
  optional DeviceInfo      deviceInfo     = 23;  // RX model / firmware
  optional WateringStatus  wateringStatus = 30;  // RX bare watering-status ack (e.g. stop -> {#1=1})
  optional BatteryReport   batteryReport  = 46;  // RX standalone battery
  optional IdentifyDevice  identifyDevice = 47;  // TX LED locate (Gen2 only; XD no-op)
  optional StatusSubscribe statusSubscribe = 57; // TX poll/subscribe -> periodic #59
  optional FlowSensorData  flowSensorData = 59;  // RX periodic flow sensor data (Gen2 only)
  optional GetActivePrograms getActivePrograms = 77; // TX: empty -> #20 enable-bitmask read
  optional ProgramSchedules programSchedules = 115; // RX bulk container {#1 setActivePrograms, #2 repeated #19}
}

// #14 timerMode is a DEVICE-GLOBAL control (not per-program/per-run). HW-verified 2026-07-06:
//   mode 0 = offMode  ("controller off / automatic watering disabled" in the app)
//   mode 1 = autoMode ("Enable Watering"; normal resting state — scheduled programs run)
//   mode 2 = manualMode (with #2.#3 => start that station; #2 EMPTY => stop the current run)
// The empty manualParams marker (#2 = `12 00`) is REQUIRED: a #14 that omits field 2 is
// silently ignored. Byte refs: autoMode `720408011200`, offMode `720408001200`, stop `720408021200`.
// RULE: a program run / stop / cleanup must never leave the controller in offMode — stop a run
// with mode 2 (empty) and return the controller to autoMode(1). offMode is only an explicit
// user "turn the whole controller off".
message TimerMode {
  optional uint32       mode         = 1;  // 0=off, 1=auto, 2=manual
  optional ManualParams manualParams = 2;  // present (may be empty) is REQUIRED
}
message ManualParams { optional StationInfo stationInfo = 3; }
message StationInfo {
  optional uint32 stationId  = 1;  // zone - 1 (0..3 on the XD)
  optional uint32 runTimeSec = 2;
  optional uint32 groupId    = 3;  // concurrent-program group (knobunc); 0 on our fleet
}

message StatusRequest {}  // sent empty; works mid-run

message SetRainDelay {
  // Field names cross-referenced to knobunc's vendor-named OrbitPbApi_SetRainDelay:
  //   #1 rainDelayTimeMins, #2 delayStartTimeSecEpochUtc, #3 delayEndTimeSecEpochUtc,
  //   #4 delayType (a ProgramDelayType enum, not a boolean flag).
  optional uint32 minutes       = 1;  // rainDelayTimeMins; 0 = clear; 1440 = 24h; 2880 = 48h
  optional uint32 expiryUnixUtc = 3;  // delayEndTimeSecEpochUtc; honored literally -> anchor to deviceClock #7
  optional uint32 delayType     = 4;  // enum (observed = 1); NOT an on/off flag. May be absent on a bare clear.
}

// #18 setDateTime (knobunc OrbitPbApi_SetDateTime). The app sends this on connect,
// but HW-verified 2026-07-06 that BOTH fw0107 (XD) and fw0111 (Gen2) IGNORE it over
// BLE (a +1h set left the clock unchanged; no reply frame) — the device wall clock
// (#7, read-only) is cloud/hub-managed and not locally settable. Kept for parity /
// in case other firmware honors it.
message SetClock { optional string localIso8601 = 1; }  // #1 currentTimeIso8601, "YYYY-MM-DDThh:mm:ss±hh:mm"

// #75 setEpochTime (knobunc/anahnymous OrbitPbApi_SetEpochTime). THE clock-set that
// actually works over BLE — HW-verified 2026-07-06 on both fw0111 (Gen2: 20 h drift ->
// in sync) and fw0107 (XD: a +1 h set took, then restored). The app also sends it on
// connect to trigger the first status burst. #2 is a SIGNED int32 (e.g. -14400 = EDT).
message SetEpochTime {
  optional uint32 timeSecEpochUTC   = 1;
  optional int32  timezoneOffsetSec = 2;  // signed; local UTC offset in seconds
}

message DeviceStatus {
  optional uint32       mode       = 1;   // 1=idle, 3=rain-delay, 4=running (manual OR program)
  optional TimerMode    activeRun  = 2;   // echo of the running command; #2.#1 = mode (1=auto,2=manual)
  optional RunProgress  progress   = 6;   // run progress, present only while watering
  optional FaultStatus  faultStatus = 7;  // faults (empty msg => none); knobunc OrbitPbApi_FaultStatus
  optional uint32       nextStartProgramFlags    = 9;  // bitmask of slot(s) that fire next (A=bit0)
  optional uint32       nextStartTimeSecEpochUTC = 10; // epoch of the next scheduled start
  optional uint32       programDelayType = 12; // why a program is delayed: 0 none/1 user/2 rain/3 wind/4 freeze
  optional SetRainDelay rainDelay  = 13;  // current rain-delay status (same shape as #17)
  optional Battery      battery    = 14;  // { #3 = mV }
}
// #16.#7 (knobunc OrbitPbApi_FaultStatus). Empty message => no faults. Scalar bools observed;
// #6 valveOnNoFlowDetected ("No Flow") HW-sampled 2026-07-06 (sticky on a dry valve).
message FaultStatus {
  optional bool pumpFault             = 1;
  optional bool voltageBoostCircuitFail = 4;
  optional bool valveOffFlowDetected  = 5;
  optional bool valveOnNoFlowDetected = 6;  // "No Flow"
  optional bool valveLowFlowDetected  = 7;
  optional bool valveHighFlowDetected = 8;
  optional bool batteryFault          = 10;
}
// #16.#6 (knobunc: OrbitPbApi_WateringStatus). HW-verified 2026-07-05 on Gen2 fw0111 + XD fw0107.
message RunProgress {
  optional uint32 remainingSec = 5;  // currentTimeRemainingSec; counts DOWN during the run
  optional uint32 totalSec     = 7;  // totalRunTimeSec; constant during the run
}
message Battery { optional uint32 millivolts = 3; }
message BatteryReport { optional Battery battery = 3; }  // #46 { #3 = mV } (standalone shape)

// #57 subscribe/poll -> device streams #59 (knobunc: OrbitPbApi_EnableFlowSensorData).
message StatusSubscribe {
  optional uint32 intervalMs = 1;  // sendDataIntervalMilliSec; e.g. 1000 -> ~1 Hz #59 stream
  optional uint32 type       = 2;  // sendDataDurationSec per knobunc (2 observed here)
}

// #59 flow sensor data (knobunc: OrbitPbApi_FlowSensorData). Gen2 only — the XD emits none.
// Our earlier reconstruction mislabeled #1 as an "active" bool and #3 as "flowRateGpm";
// the vendor names below are authoritative. status.py uses #1 as a "water flowing" signal
// (it reads ~0 when dry) and derives instantaneous gpm from the SLOPE of the #3 tick counter.
message FlowSensorData {
  optional uint32 flowRateFrequencyHz  = 1;  // currentFlowRateFrequency_Hz; ~0 when no water moving
  optional uint32 cycleRunTimeSec      = 2;  // currentCycleRunTimeSec
  optional uint32 cycleVolumeTicks     = 3;  // currentCycleVolumeTicks; CUMULATIVE per-run, resets each open
  optional float  flowRateGpm          = 4;  // currentFlowRateGpm (direct rate; not yet HW-confirmed populated)
  optional float  cycleVolumeGal       = 5;  // currentCycleVolumeGal
}

// #30 bare watering-status ack (knobunc: OrbitPbApi_WateringStatus). A STOP replies with only
// { #1 = Status } and no #16 status block, so a stop is confirmed by a follow-up #15{} read.
message WateringStatus {
  optional uint32 status = 1;  // Status enum: 1 complete, 2 inProgress, 3 pumpDelay, 4 stationComplete,
                               // 5 stationDelay, 6 programPreDelay, 7 programPostDelay
}
// #20 setActivePrograms — the program-ENABLE bitmask (NOT a "commit"; corrected 2026-07-06 from
// anahnymous's app decompile + knobunc's schema). activeProgramFlags is a uint32 bitmask, program
// A = bit 0 (`1 << (slotId-1)`: A=1, B=2, C=4, D=8, E=16). The "n" values 8/9/12/13 we recorded
// earlier were bitmasks, not a version counter. Written to enable slots; also returned on read
// (via #10 syncRequest or #77 getActivePrograms) to report which slots are enabled.
message SetActivePrograms {
  optional uint32 activeProgramFlags       = 1;  // bitmask, A=bit0
  optional uint32 lastChangeDateSecEpochUtc = 2;
  optional uint32 lastChangeId             = 3;  // InterfaceId
}

// #10 syncRequest — empty request; the device replies with a full state dump: every #19 program
// slot + a #16 status block + the #20 enable bitmask (+ #29 settings), streamed as back-to-back
// OrbitBleMessages. This is the program-READ path (no per-slot read / write-and-echo needed).
message SyncRequest {}

// #77 getActivePrograms — empty request; replies with just the #20 enable bitmask (cheap read).
message GetActivePrograms {}

// #11 closeConnection — graceful pre-disconnect. Both fields optional; an empty body is valid.
message CloseConnection {
  optional uint32 reconnectTimeSec = 1;
  optional bool   resetTestMode    = 2;
}

// #47 identifyDevice — LED locate. HW 2026-07-06: on Gen2 (fw0111) #1>0 starts a red flash and
// LATCHES (identifyTimeSec is not a reliable auto-off); #1=0 stops it. The custom #3 color
// sequence is ignored by fw0111 (default red only). On the XD (fw0107, LCD) it's a NO-OP.
// Fire-and-forget: no reply frame, no CTR desync.
message IdentifyDevice {
  optional uint32 identifyTimeSec  = 1;  // required; 0 = stop
  optional uint32 identifyPeriodMs = 2;
  repeated IdentifySequence identifySequence = 3;
}
message IdentifySequence {
  optional uint32 colorFlags = 1;  // red=0, green=1, blue=2 (bit flags)
  optional uint32 durationMs = 2;
}

// #115 programSchedules — bulk container (knobunc OrbitPbApi_ProgramSchedules). Plausible one-shot
// program-dump shape; on our fleet the #10 dump instead streams independent #19 messages.
message ProgramSchedules {
  optional SetActivePrograms setActivePrograms = 1;
  repeated WateringProgram   programs          = 2;
}

message DeviceInfo {
  optional uint32 kind     = 1;
  optional string model    = 2;  // "HT34A-0001"
  optional bytes  firmware = 3;  // packed fw digits
}

// Watering program (slots A–F; A–D exposed). Exactly one of the day-mode fields (#3–#7) is set.
// Create/edit/replace = write the full message to slotId. Delete = write { slotId; #2 NotSet {} }
// (clears the slot to programTypeNotSet). A stored program does NOT run on its own — enabling it
// is the #20/#14 handshake (see SetActivePrograms + TimerMode).
message WateringProgram {
  optional uint32          slotId        = 1;   // programId enum: 0=manual, A=1, B=2, C=3, D=4, E=5, F=6
  optional EmptyMarker     notSet        = 2;   // programTypeNotSet (empty slot / delete target)
  optional WeekdayMask     weekdays      = 3;   // specific weekdays
  optional IntervalSchedule everyNDays   = 4;   // every N days
  optional EmptyMarker     oddDays       = 5;   // odd calendar days
  optional EmptyMarker     evenDays      = 6;   // even calendar days
  optional RunOnce         runOnce       = 7;   // one-time run (knobunc programTypeRunOnce)
  repeated uint32          startTimesMin = 8;   // start times, minutes-of-day (device-local)
  repeated ZoneRunTime     zoneRunTimes  = 9;   // per-zone (StationInfo shape)
  optional uint32          budgetPct     = 10;  // seasonal adjust % (100 on our fleet)
  // #11/#12 startDate/stopDate are DEPRECATED in knobunc's schema; the current pair is #21/#22.
  // None of our devices store a schedule window (cloud-managed) — treat as read-only if present.
  optional uint32          scheduleStart = 11;  // DEPRECATED startDateSecEpochUtc
  optional uint32          scheduleEnd   = 12;  // DEPRECATED stopDateSecEpochUtc
  optional uint32          lastChangeDateSecEpochUtc = 13;
  optional uint32          lastChangeId  = 14;  // InterfaceId (2 = wifiInterface on our seeded slots)
  optional string          name          = 17;  // UTF-8
  optional uint32          intervalHours = 18;  // interval day-mode sub-day period
  optional bool            basicProgramMode = 19;
  optional uint32          databaseId    = 20;  // inner scope — NOT the #20 enable message
  optional uint32          originDateSecEpochUtc = 21;  // current schedule anchor
  optional uint32          endDateSecEpochUtc    = 22;  // current schedule end
}
message WeekdayMask { optional uint32 bitmask = 1; }  // bit0=Sun .. bit6=Sat
message IntervalSchedule {
  optional uint32 n         = 1;  // every N days (intervalDays)
  // #2 intervalStartTimeIso8601 is marked DEPRECATED in knobunc's schema but is still LIVE on
  // fw0107/fw0111 (slot B populated it, #21 originDate was NOT) — our encoder emits #4.#2.
  optional string anchorIso = 2;  // ISO-8601 anchor date
}
message RunOnce { optional uint32 programFlags = 1; }
message EmptyMarker {}
message ZoneRunTime {
  optional uint32 zoneIndex = 1;
  optional uint32 runSec    = 2;
  optional uint32 groupId   = 3;  // concurrent-program group (0 on our fleet)
}
